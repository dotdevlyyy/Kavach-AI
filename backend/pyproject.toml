[project]
name = "kavach-ai-backend"
version = "1.0.0"
description = "Kavach AI — Sovereign On-Premise Agentic AI Workbench Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "msgspec>=0.19.0",
    "tortoise-orm>=0.22.0",
    "aiosqlite>=0.20.0",
    "ollama>=0.4.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "PyMuPDF>=1.25.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "loguru>=0.7.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
